{% extends "base.html" %}
{% block content %}
<h2>Make a deal</h2>
<div class="card">
    <form method="POST">
        <label>ID object</label>
        <input type="number" name="object_id" required>

        <label>ID client</label>
        <input type="number" name="client_id" required>

        <label>ID staff</label>
        <input type="number" name="employee_id" required>

        <label>Amount</label>
        <input type="number" step="0.01" name="amount" required>

        <label>Deal type</label>
        <select name="action">
            <option value="1">Rent</option>
            <option value="2">Sell</option>
        </select>

        <button type="submit">Deal</button>
    </form>

    {% if message %}
        <div class="message {{ 'ok' if message.startswith('[+]') else 'err' }}">{{ message }}</div>
    {% endif %}
</div>
{% endblock %}
